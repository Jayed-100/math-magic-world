*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'Fredoka','Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bg i{position:absolute;bottom:-60px;font-style:normal;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 14px 40px}
.screen{animation:in .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.97)}}

.top h2{margin:0;font-size:26px;flex:1}
.ib{width:52px;height:52px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--sh);font-size:24px;cursor:pointer;color:var(--ink);font-family:inherit}
.ib:active,.btn:active,.opt:active,.card:active{transform:translateY(4px) scale(.97)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.chip{background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 rgba(80,60,160,.12)}
.hero{text-align:center}
.hero h1{font-size:clamp(30px,8vw,46px);margin:0;line-height:1;background:linear-gradient(90deg,#ff6fa5,#ffae3d,#37c98b,#4aa8ff,#a46bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(80,60,160,.15))}
.tag{font-weight:600;color:var(--soft);margin:4px 0 0}
.hello{font-size:24px;font-weight:700;margin:6px 0 0}
.mascot{width:150px;height:150px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(80,60,160,.25))}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.card{border:0;border-radius:30px;padding:16px 12px 14px;text-align:center;box-shadow:var(--sh);cursor:pointer;position:relative;overflow:hidden;font-family:inherit;color:#33285f;transition:transform .15s}
.card:hover{transform:translateY(-5px) rotate(-1deg)}
.card .scene{font-size:46px;line-height:1.1;animation:bob 3s ease-in-out infinite}
.card .sym{position:absolute;top:8px;right:14px;font-size:34px;font-weight:700;opacity:.35}
.card h3{margin:6px 0 2px;font-size:19px}.card p{margin:0 0 10px;font-size:14px;font-weight:500;opacity:.85;min-height:36px}
.play{display:inline-block;background:#fff;border-radius:999px;padding:8px 22px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.add{background:linear-gradient(160deg,#ffc6dc,var(--c-add))}.sub{background:linear-gradient(160deg,#bdeaff,var(--c-sub))}
.mul{background:linear-gradient(160deg,#c5f5da,var(--c-mul))}.div{background:linear-gradient(160deg,#ffe3ad,var(--c-div))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.btn{border:0;border-radius:22px;padding:15px 18px;font-size:20px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff;background:linear-gradient(180deg,#9b7bff,#7a52f0);box-shadow:0 7px 0 #5a38c4,0 12px 20px rgba(90,56,196,.3);transition:transform .1s}
.btn.y{background:linear-gradient(180deg,#ffe066,#ffbf2e);color:#5b3b00;box-shadow:0 7px 0 #d99510,0 12px 20px rgba(217,149,16,.3)}
.btn.g{background:linear-gradient(180deg,#5fe3a2,#27c27a);box-shadow:0 7px 0 #14925a,0 12px 20px rgba(20,146,90,.3)}
.btn.w{grid-column:1/-1}

.bar{height:20px;background:rgba(120,100,200,.18);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd94a,#ff9ec0,#a46bff);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.qbox{text-align:center}
.expr{font-size:clamp(46px,14vw,78px);font-weight:700;margin:4px 0;letter-spacing:2px}
.expr em{font-style:normal;color:#ff6fa5}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.opt{border:0;border-radius:26px;min-height:92px;font-size:42px;font-weight:700;font-family:inherit;color:#33285f;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.14);transition:transform .1s}

#splash{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(170deg,#86d8ff,#c9a8ff 60%,#ffb8da);color:#fff;transition:opacity .6s,transform .6s;overflow:hidden}

const t=k=>T[S.lang][k],today=()=>new Date().toISOString().slice(0,10);
/* sound */
let AC;function tone(f,d,at=0,type='sine',v=.15){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const SFX={click:()=>tone(520,.08,0,'triangle',.1),ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.08)),no:()=>{tone(330,.18,0,'sine',.1);tone(294,.25,.14,'sine',.1)},coin:()=>{tone(988,.08,0,'square',.06);tone(1319,.25,.08,'square',.06)},win:()=>[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.22,i*.1,'triangle'))};
/* generator */
const MAX={easy:10,medium:50,hard:100};
function mk(op,l){let a,b,ans,M=MAX[l];
 if(op==='add'){a=R(l==='easy'?0:10,l==='easy'?M:M-5);b=R(l==='easy'?0:5,M-a);ans=a+b}
 else if(op==='sub'){a=R(l==='easy'?1:11,M);b=R(l==='easy'?0:1,a);ans=a-b}
 else if(op==='mul'){a=l==='hard'?R(2,10):R(2,5);b=l==='easy'?R(1,5):R(1,10);ans=a*b}
 else{b=l==='hard'?R(2,10):R(2,5);ans=R(1,l==='easy'?5:10);a=b*ans}
 const s=new Set([ans]);let g=0;while(s.size<4){let d=ans+pick([-1,1])*R(1,g++>12?12:4);if(d>=0&&(op!=='sub'||d>=0))s.add(d)}
 return{op,l,a,b,ans,o:[...s].sort(()=>Math.random()-.5),k:op+a+'_'+b}}
function session(ops,lvls,n=10){const out=[],seen=new Set();let tries=0;while(out.length<n&&tries++<400){const q=mk(pick(ops),pick(lvls));if(!seen.has(q.k)||tries>200){seen.add(q.k);out.push(q)}}return out}
/* art */
const mascot=()=>`<svg class="mascot" viewBox="0 0 120 120"><defs><radialGradient id="mg" cx="40%" cy="30%"><stop offset="0" stop-color="#fff2a0"/><stop offset="1" stop-color="#ffc21f"/></radialGradient></defs>
<path d="M60 8l13 29 31 3-23 21 7 31-28-16-28 16 7-31L16 40l31-3z" fill="url(#mg)" stroke="#f29a00" stroke-width="3" stroke-linejoin="round"/>
<ellipse class="eye" cx="48" cy="58" rx="5" ry="7" fill="#3a2f6b"/><ellipse class="eye" cx="72" cy="58" rx="5" ry="7" fill="#3a2f6b"/><circle cx="50" cy="55" r="2" fill="#fff"/><circle cx="74" cy="55" r="2" fill="#fff"/>
<ellipse cx="38" cy="70" rx="7" ry="4" fill="#ff9ec0" opacity=".8"/><ellipse cx="82" cy="70" rx="7" ry="4" fill="#ff9ec0" opacity=".8"/><path d="M50 72q10 12 20 0" fill="#c9345f" stroke="#3a2f6b" stroke-width="2.5" stroke-linecap="round"/>
<path d="M30 12l8-6M90 8l-6-6" stroke="#a46bff" stroke-width="4" stroke-linecap="round"/><path d="M48 14h24l-12-20z" fill="#a46bff" transform="translate(0,8)"/></svg>`;
function vis(q){const e=EM[q.op],r=(n,c='')=>Array.from({length:n},(_,i)=>`<span class="${c}">${e}</span>`).join('');
 if(q.op==='add'&&q.a+q.b<=24)return r(q.a)+'<span class="op">+</span>'+r(q.b);
 if(q.op==='sub'&&q.a<=24)return Array.from({length:q.a},(_,i)=>`<span class="${i>=q.a-q.b?'gone':''}">${e}</span>`).join('');
 if(q.op==='mul'&&q.a*q.b<=30)return Array.from({length:q.a},()=>`<div class="grp">${r(q.b)}</div>`).join('');
 if(q.op==='div'&&q.a<=30)return `<div class="grp">${'👽'.repeat(q.b)}</div><span class="op">←</span><div class="grp">${r(q.a)}</div>`;
 return `<span style="font-size:56px">${SCENE[q.op]}</span>`}
const story=q=>t({add:'vAdd',sub:'vSub',mul:'vMul',div:'vDiv'}[q.op])(q.a,q.b);
function confetti(){if(S.calm)return;const c=['#ff6fa5','#ffd94a','#37c98b','#4aa8ff','#a46bff','#ff9a3d'];for(let i=0;i<46;i++){const s=document.createElement('i');s.className='conf';s.style.cssText=`left:${R(0,100)}vw;background:${pick(c)};--dx:${R(-90,90)}px;animation-delay:${Math.random()*.4}s;border-radius:${pick(['2px','50%'])}`;document.body.appendChild(s);setTimeout(()=>s.remove(),2400)}}
/* background */
(function(){const b=$('#bg');for(let i=0;i<16;i++){const x=document.createElement('i');x.textContent=pick(['⭐','✨','🫧','☁️','💫']);x.style.cssText=`left:${R(0,96)}%;font-size:${R(18,40)}px;animation-duration:${R(14,30)}s;animation-delay:-${R(0,30)}s`;b.appendChild(x)}})();
/* ui */
const app=$('#app');let G=null,pending=null,resetArm=false;
const lvl=()=>1+Math.floor(S.stars/10);
const opName=o=>t(o==='sub'?'sub_':o);
const head=(title,back='home')=>`<div class="top"><button class="ib" data-a="${back}" aria-label="${t('home')}">${back==='home'?'🏠':'⬅️'}</button><h2>${title}</h2><button class="ib" data-a="snd" aria-label="sound">${S.sound?'🔊':'🔇'}</button></div>`;
const show=h=>{app.innerHTML=`<div class="screen">${h}</div>`;scrollTo(0,0);document.body.classList.toggle('calm',S.calm)};
const unlocked=l=>l==='easy'||S.best[l==='medium'?'easy':'medium']>=2;
function home(){G=null;show(`<div class="hero">${mascot()}<h1>Math Magic World</h1><p class="tag">${t('tag')}</p><p class="hello">${t('hi')}</p><p class="tag">${t('sub')}</p></div>
<div class="chips"><span class="chip">⭐ ${S.stars} ${t('stars')}</span><span class="chip">🪙 ${S.coins}</span><span class="chip">🏅 ${t('level')} ${lvl()}</span>${S.streak>1?`<span class="chip">🔥 ${S.streak}</span>`:''}</div>
<div class="grid">${OPS.map(o=>`<button class="card ${o}" data-a="pick" data-o="${o}"><span class="sym">${SYM[o]}</span><div class="scene">${SCENE[o]}</div><h3>${opName(o)}</h3><p>${t(o+'D')}</p><span class="play">▶ ${t('play')}</span></button>`).join('')}</div>
<div class="row2"><button class="btn y w" data-a="daily">🎁 ${t('daily')} ${S.daily===today()?'✅':''}</button><button class="btn g" data-a="learn">💡 ${t('learn')}</button><button class="btn" data-a="prog">📊 ${t('progress')}</button><button class="btn w" style="background:linear-gradient(180deg,#8fd0ff,#4aa8ff);box-shadow:0 7px 0 #2a7fd0" data-a="set">⚙️ ${t('settings')}</button></div>`)}
function pickLvl(o){show(head(opName(o))+`<div class="panel qbox"><div class="scene" style="font-size:64px">${SCENE[o]}</div><h2>${t('pick')}</h2><div class="lv">${['easy','medium','hard'].map((l,i)=>`<button class="btn ${unlocked(l)?['g','y',''][i]:'lock'}" data-a="start" data-o="${o}" data-l="${l}" ${unlocked(l)?'':'data-locked=1'}>${unlocked(l)?'':'🔒 '}${t(l)}<br>${'⭐'.repeat(Math.min(3,S.best[l+o]||0))||'☆'}</button>`).join('')}</div><p class="small">${t('unlock')}</p></div>`)}
function start(ops,lvls,daily){G={qs:session(ops,lvls),i:0,sc:0,ops,lvls,daily,right:0,ans:false,per:{add:[0,0],sub:[0,0],mul:[0,0],div:[0,0]}};ask()}
function ask(){const q=G.qs[G.i];G.ans=false;const pct=G.i/G.qs.length*100;
 show(head(`${t('q')} ${G.i+1}/${G.qs.length}`,'home')+`<div class="bar"><b style="width:${pct}%"></b></div><div class="chips"><span class="chip">${t('score')} ${G.sc}</span><span class="chip">⭐ ${G.right}</span></div>
<div class="panel qbox"><div class="small" style="font-weight:700">${t('what')}</div><div class="vis">${vis(q)}</div><div class="expr">${q.a} <em>${SYM[q.op]}</em> ${q.b} = ?</div><p class="small">${story(q)}</p>
<div class="opts">${q.o.map(v=>`<button class="opt" data-a="ans" data-v="${v}">${v}</button>`).join('')}</div></div><div id="fbz"></div>`)}
function answer(v,btn){if(G.ans)return;G.ans=true;const q=G.qs[G.i],ok=v===q.ans;
 S.st[q.op][1]++;G.per[q.op][1]++;
 document.querySelectorAll('.opt').forEach(b=>{if(+b.dataset.v===q.ans)b.classList.add('ok');else if(b===btn)b.classList.add('no');b.disabled=true});
 if(ok){S.st[q.op][0]++;G.per[q.op][0]++;G.sc+=10;G.right++;S.coins+=5;SFX.ok();setTimeout(SFX.coin,350);confetti()}else{SFX.no();if(!S.calm){const f=document.createElement('div');f.className='rf';document.body.appendChild(f);setTimeout(()=>f.remove(),1100)}try{navigator.vibrate&&navigator.vibrate([250,100,250])}catch(e){}}
 save();const last=G.i===G.qs.length-1;
 $('#fbz').innerHTML=`<div class="fb ${ok?'':'bad'}"><div style="font-size:54px">${ok?'🌟':'❌'}</div><h3>${ok?pick(t('good')):t('oops')}</h3><p>${ok?'+5 🪙':`${t('ans')} <b style="font-size:34px">${q.ans}</b><br>${t('tried')}`}</p><button class="btn y" data-a="nxt" style="width:100%">${t('next')}</button></div>`;
 if(ok)G.timer=setTimeout(()=>{if(G&&G.ans&&G.qs[G.i]===q)nxt()},2200)}
function nxt(){clearTimeout(G.timer);SFX.click();if(G.i<G.qs.length-1){G.i++;ask()}else finish()}
function finish(){const n=G.qs.length,r=G.right,st=r>=n-1?3:r>=Math.round(n*.6)?2:r>=3?1:0,lv=G.lvls[0],key=G.daily?'daily':lv+G.ops[0];
 S.stars+=st;S.coins+=st*10+(G.daily?30:0);if(!G.daily&&G.ops.length===1)S.best[key]=Math.max(S.best[key]||0,st);
 if(!G.daily&&G.ops.length===1)S.best[lv]=Math.max(S.best[lv]||0,st);
 if(G.daily)S.daily=today();
 const td=today(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(S.last!==td){S.streak=S.last===y?S.streak+1:1;S.last=td}
 const tot=OPS.reduce((s,o)=>s+S.st[o][1],0),cor=o=>S.st[o][0],chk={first:OPS.some(o=>cor(o)>0),add:cor('add')>=20,sub:cor('sub')>=20,mul:cor('mul')>=20,div:cor('div')>=20,ten:tot>=10,perfect:r===n};
 const nu=Object.keys(chk).filter(k=>chk[k]&&!S.badges.includes(k));S.badges.push(...nu);save();SFX.win();confetti();
 show(`<div class="panel qbox"><div style="font-size:70px">🏆</div><h2 style="font-size:32px;margin:0">${t('done')}</h2><div class="stars3">${[1,2,3].map(i=>`<span style="animation-delay:${i*.25}s;${i>st?'filter:grayscale(1);opacity:.3':''}">⭐</span>`).join('')}</div>
<p style="font-size:22px;font-weight:600">${r}/${n} ✔ &nbsp; +${st*10+(G.daily?30:0)} 🪙</p>${nu.map(k=>`<div class="chip" style="display:inline-block;margin:4px">🎖️ ${T[S.lang].b[k]}</div>`).join('')}
<div class="row2"><button class="btn g" data-a="again">${t('again')}</button><button class="btn" data-a="home">🏠 ${t('home')}</button></div></div>`);G.over=true}
function learn(o){o=o||'add';const q=mk(o,'easy');show(head(t('learnT'))+`<div class="chips">${OPS.map(x=>`<button class="chip" data-a="learn" data-o="${x}" style="border:0;font-family:inherit;color:inherit;cursor:pointer;${x===o?'outline:4px solid #a46bff':''}">${SYM[x]}</button>`).join('')}</div>
<div class="panel qbox"><h2 style="margin:0">${opName(o)}</h2><div class="vis">${vis(q)}</div><div class="expr">${q.a} <em>${SYM[o]}</em> ${q.b} = <em>${q.ans}</em></div>
<ol class="steps"><li>${story(q)}</li><li>${t('st')[o]}</li><li>${q.a} ${SYM[o]} ${q.b} = <b>${q.ans}</b> 🎉</li></ol><button class="btn y w" data-a="learn" data-o="${o}" style="width:100%">🔄 ${t('another')}</button></div>`)}
function prog(){const A=OPS.reduce((s,o)=>s+S.st[o][1],0),C=OPS.reduce((s,o)=>s+S.st[o][0],0),acc=A?Math.round(C/A*100):0;
 const bs=OPS.filter(o=>S.st[o][1]>0).sort((x,y)=>S.st[y][0]/S.st[y][1]-S.st[x][0]/S.st[x][1])[0];
 show(head(t('progress'))+`<div class="chips"><span class="chip">⭐ ${S.stars}</span><span class="chip">🪙 ${S.coins}</span><span class="chip">🏅 ${t('level')} ${lvl()}</span><span class="chip">🔥 ${S.streak}</span></div>
<div class="panel"><div class="sr"><span>${t('total')}</span><b>${A}</b></div><div class="sr"><span>✅ ${t('right')}</span><b>${C}</b></div><div class="sr"><span>💭 ${t('wrong')}</span><b>${A-C}</b></div><div class="sr"><span>${t('acc')}</span><div class="bar"><b style="width:${acc}%"></b></div><b>${acc}%</b></div>
${bs?`<div class="sr"><span>${t('best')}</span><b>${SYM[bs]} ${opName(bs)}</b></div>`:''}
${OPS.map(o=>{const p=S.st[o][1]?Math.round(S.st[o][0]/S.st[o][1]*100):0;return `<div class="sr"><span>${SYM[o]} ${opName(o).split(' ')[0]}</span><div class="bar"><b style="width:${p}%"></b></div><span style="width:44px">${p}%</span></div>`}).join('')}</div>
<div class="panel"><h3 style="margin:0 0 10px">🎖️ ${t('badges')}</h3><div class="bgrid">${Object.keys(T.en.b).map((k,i)=>`<div class="badge ${S.badges.includes(k)?'':'off'}"><i>${['🥇','🍎','🎈','🦁','👽','🔟','💯'][i]}</i>${t('b')[k]}</div>`).join('')}</div></div>
<div class="panel"><h3 style="margin:0 0 6px">👨‍👩‍👧 ${t('parent')}</h3><p style="margin:0;font-weight:500;font-size:17px">${t('parentTxt')(A,C,bs?opName(bs):'')}</p></div>`)}
function sett(){show(head(t('settings'))+`<div class="panel"><div class="tog">${t('sound')}<button class="sw ${S.sound?'on':''}" data-a="tsnd"></button></div><div class="tog"><span style="font-size:17px;opacity:.7">${t('music')}</span><button class="sw" disabled style="opacity:.4"></button></div><div class="tog">${t('motion')}<button class="sw ${S.calm?'':'on'}" data-a="tcalm"></button></div>
<div class="tog">${t('lang')}<button class="btn" data-a="lang" style="padding:8px 18px;font-size:18px">${S.lang==='en'?'বাংলা':'English'}</button></div>
<div class="tog" style="border:0">${t('reset')}<button class="btn y" data-a="reset" style="padding:8px 18px;font-size:18px">${resetArm?t('sure'):'🗑️'}</button></div></div>
<div class="panel"><h3 style="margin:0 0 6px">ℹ️ ${t('about')}</h3><p style="margin:0;font-weight:500">${t('aboutT')}</p></div>`)}
function dailyGo(){if(S.daily===today()){show(head(t('daily'))+`<div class="panel qbox"><div style="font-size:70px">🎁</div><h2>${t('dailyDone')}</h2></div>`);return}
 start(OPS,unlocked('hard')?['easy','medium','hard']:unlocked('medium')?['easy','medium']:['easy'],true)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;if(a!=='ans')SFX.click();if(a!=='reset')resetArm=false;
 if(a==='home'){if(G&&G.timer)clearTimeout(G.timer);home()}
 else if(a==='pick')pickLvl(d.o);
 else if(a==='start'){if(d.locked)return;pending={o:d.o,l:d.l};start([d.o],[d.l])}
 else if(a==='again'){G.daily?dailyGo():start(G.ops,G.lvls)}
 else if(a==='ans')answer(+d.v,el);else if(a==='nxt')nxt();
 else if(a==='daily')dailyGo();else if(a==='learn')learn(d.o);else if(a==='prog')prog();else if(a==='set')sett();
 else if(a==='snd'||a==='tsnd'){S.sound=!S.sound;save();if(a==='tsnd')sett();else el.textContent=S.sound?'🔊':'🔇'}
 else if(a==='tcalm'){S.calm=!S.calm;save();sett()}
 else if(a==='lang'){S.lang=S.lang==='en'?'bn':'en';document.documentElement.lang=S.lang;save();sett()}
 else if(a==='reset'){if(resetArm){S={...DEF,lang:S.lang,sound:S.sound,calm:S.calm,st:{add:[0,0],sub:[0,0],mul:[0,0],div:[0,0]},badges:[],best:{}};save();resetArm=false;home()}else{resetArm=true;sett()}}});
document.documentElement.lang=S.lang;home();

(function(){const sp=$('#splash'),box=sp.firstChild,name='Math Magic World';
box.innerHTML=mascot()+'<h1>'+(()=>{let n=0;return name.split(' ').map(w=>'<b class="w">'+[...w].map(c=>`<span style="animation-delay:${.9+(n++)*.06}s">${c}</span>`).join('')+'</b>').join('')})()+'</h1><p>'+t('tag')+'</p><div class="ld"><i></i><i></i><i></i></div>';
['✨','⭐','💫','✨','⭐','💫'].forEach((e,i)=>{const x=document.createElement('span');x.className='sp';x.textContent=e;x.style.cssText=`left:${[8,82,14,76,45,50][i]}%;top:${[12,16,76,80,6,90][i]}%;animation-delay:${i*.25}s`;sp.appendChild(x)});
let gone=false;const bye=()=>{if(gone)return;gone=true;sp.classList.add('hide');setTimeout(()=>sp.remove(),700)};
sp.addEventListener('click',bye);setTimeout(bye,S.calm?900:2800)})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
